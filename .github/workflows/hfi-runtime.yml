name: HAHAWEEK HFI-MVP Runtime Verification
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: runtime
        continue-on-error: true
        env:
          RPC_TIMEOUT_MS: 30000
        run: |
          set +e
          npm run hfi:runtime
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfi-mvp-e5-runtime-${{ github.run_id }}
          path: docs/runtime/hfi-mvp-e2e-latest.json
          if-no-files-found: error
          retention-days: 30
      - if: steps.runtime.outputs.exit_code != '0'
        run: exit 1
