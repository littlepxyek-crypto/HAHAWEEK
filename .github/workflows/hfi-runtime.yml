name: HAHAWEEK HFI-MVP Runtime Verification
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: runtime
        continue-on-error: true
        env:
          RPC_URL: https://rpc.mainnet.chain.robinhood.com
          RPC_TIMEOUT_MS: 30000
          # Candidate hint only; every formation/outcome event is re-verified from Robinhood RPC.
          HFI_POOL_ID: "0x387bf619da4d3fb62bb276482693dba1b9b3520f573cabdfe033384a24125982"
          HFI_POOL_INIT_BLOCK: "169464"
        run: |
          set +e
          rm -f docs/runtime/hfi-mvp-e2e-latest.json
          npm run hfi:runtime
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify runtime artifact provenance
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          test -f docs/runtime/hfi-mvp-e2e-latest.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('docs/runtime/hfi-mvp-e2e-latest.json','utf8'));if(x.commit!==process.env.GITHUB_SHA){console.error('RUNTIME_ARTIFACT_COMMIT_MISMATCH',x.commit,process.env.GITHUB_SHA);process.exit(1)}"
      - name: Upload HFI-MVP runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfi-mvp-e2e-runtime-evidence-${{ github.sha }}
          path: docs/runtime/hfi-mvp-e2e-latest.json
          if-no-files-found: error
          retention-days: 90
      - if: steps.runtime.outputs.exit_code != '0'
        run: |
          echo "HFI-MVP runtime verification did not reach VERIFIED; preserved runtime evidence is authoritative."
          exit 1
