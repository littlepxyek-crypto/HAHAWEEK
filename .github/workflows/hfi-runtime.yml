name: HAHAWEEK HFI-MVP Runtime Verification
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: runtime
        continue-on-error: true
        env:
          RPC_URL: https://rpc.mainnet.chain.robinhood.com
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RPC_TIMEOUT_MS: 30000
          HFI_POOL_ID: "0xf399bd1544377680d48c62fd85c2105b869e55906c4189cc5ab3b4e83446928c"
          HFI_POOL_INIT_BLOCK: "59281988"
        run: |
          set +e
          rm -f docs/runtime/hfi-mvp-e2e-latest.json
          # Bound the process independently of the Node watchdog; preserve SIGTERM evidence.
          timeout --verbose --signal=TERM --kill-after=15s 25m npm run hfi:runtime
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f docs/runtime/hfi-mvp-e2e-latest.json ]; then
            node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('docs/runtime/hfi-mvp-e2e-latest.json','utf8'));console.log('HFI_RUNTIME_RESULT '+JSON.stringify({state:x.state,stage:x.stage,started_at:x.started_at,completed_at:x.completed_at,latest_block:x.latest_block,failure:x.failure||null,candidate_results:x.candidate_results||[]}))"
          else
            echo "HFI_RUNTIME_RESULT {\"state\":\"MISSING_ARTIFACT\",\"exit_code\":$code}"
          fi
          exit 0
      - name: Verify runtime artifact provenance
        if: always()
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -f docs/runtime/hfi-mvp-e2e-latest.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('docs/runtime/hfi-mvp-e2e-latest.json','utf8'));if(x.commit!==process.env.EXPECTED_COMMIT){console.error('RUNTIME_ARTIFACT_COMMIT_MISMATCH',x.commit,process.env.EXPECTED_COMMIT);process.exit(1)}"
      - name: Upload HFI-MVP runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfi-mvp-e2e-runtime-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: docs/runtime/hfi-mvp-e2e-latest.json
          if-no-files-found: error
          retention-days: 90
      - if: steps.runtime.outputs.exit_code != '0'
        run: |
          echo "HFI-MVP runtime verification did not reach VERIFIED; preserved runtime evidence is authoritative."
          exit 1
