name: HAHAWEEK HFI-MVP Runtime Verification
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: runtime
        continue-on-error: true
        env:
          RPC_TIMEOUT_MS: 30000
        run: |
          set +e
          npm run hfi:runtime
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime/hfi-mvp-e2e-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "HFI-MVP runtime evidence [skip ci]"
          git push origin HEAD:main
      - if: steps.runtime.outputs.exit_code != '0'
        run: exit 1
