name: HAHAWEEK HFI-MVP Runtime

on:
  push:
    branches: ["hfi-mvp-e2e-v0-1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  hfi-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run hfi:runtime
        env:
          HFI_SEARCH_BLOCKS: 250000
          HFI_DISCOVERY_INDEXER: https://api.par.family
          HFI_DISCOVERY_TOKEN: 0xf3c5b06cd59c5e2018ea483482ece29005cff7ba
          HFI_LOG_CHUNK: 100000
          HFI_FORMATION_LOOKAHEAD: 20000
          HFI_POOL_ID: "0xfcfae8fa0bd6da961bcf5d990f27690932deac4f093e99bf3e871691c6586593"
          HFI_POOL_INIT_BLOCK: "8793983"
      - name: Upload HFI runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfi-mvp-e2e-runtime
          path: docs/runtime/hfi-mvp-e2e-latest.json
          if-no-files-found: warn
