name: HAHAWEEK Test Timeout Diagnostic

on:
  push:
    branches: ["architecture/agent-read-boundary-v1"]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run tests with bounded timeout
        shell: bash
        run: |
          set +e
          timeout 90s npm test > test-output.log 2>&1
          status=$?
          echo "npm_test_exit=$status" >> test-output.log
          cat test-output.log
          exit "$status"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hahaweek-test-timeout-diagnostic
          path: test-output.log
