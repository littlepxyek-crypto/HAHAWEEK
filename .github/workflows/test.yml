name: HAHAWEEK Tests

on:
  push:
    branches: ["main", "step-*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run verify:v4
      - run: npm run verify:v4:coverage
