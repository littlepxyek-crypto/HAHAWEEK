name: HAHAWEEK Tests

on:
  push:
    branches: ["main", "step-*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run verify:v4
      - run: npm run verify:v4:coverage
